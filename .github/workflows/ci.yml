name: CI - React Native

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - 'release/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, TypeScript y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Ejecutar pruebas
        run: npm run test:ci

      - name: Conservar resultados de caja blanca
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-jest
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Compilación Android Debug
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Configurar Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar sin ejecutar la aplicación ni publicar artefactos
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain

  security:
    name: Análisis SAST con Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Instalar Semgrep
        run: pip install semgrep==1.181.0

      - name: Ejecutar análisis SAST
        run: semgrep scan --config p/typescript --config p/secrets --severity ERROR --error --metrics off --no-git-ignore src App.tsx index.js android/app/src/main/java

  # Firma de producción (#127). Solo se ejecuta con workflow_dispatch o push a
  # release/**; en PR y push a develop queda omitido y no afecta los checks requeridos.
  # Secrets de GitHub requeridos (Settings > Secrets and variables > Actions):
  #   CMP_RELEASE_KEYSTORE_BASE64  -> el .jks de producción codificado en base64
  #   CMP_RELEASE_STORE_PASSWORD, CMP_RELEASE_KEY_ALIAS, CMP_RELEASE_KEY_PASSWORD
  release-aab:
    name: Build firmado de producción (.aab)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Configurar Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias
        run: npm ci
      - name: Decodificar keystore de producción
        env:
          KEYSTORE_BASE64: ${{ secrets.CMP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret CMP_RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          # RUNNER_TEMP queda fuera del workspace: el .jks nunca entra a un artifact.
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-ci.keystore"
          echo "CMP_RELEASE_STORE_FILE=$RUNNER_TEMP/release-ci.keystore" >> "$GITHUB_ENV"
      - name: Compilar y firmar el .aab de release
        working-directory: android
        env:
          CMP_RELEASE_STORE_PASSWORD: ${{ secrets.CMP_RELEASE_STORE_PASSWORD }}
          CMP_RELEASE_KEY_ALIAS: ${{ secrets.CMP_RELEASE_KEY_ALIAS }}
          CMP_RELEASE_KEY_PASSWORD: ${{ secrets.CMP_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --console=plain
      - name: Publicar el .aab firmado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cmp-movil-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Eliminar keystore temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/release-ci.keystore"
